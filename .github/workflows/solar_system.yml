name: solar_syetem workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
env: 
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
jobs:
    unit_testing:
        name: unit testing
        strategy:
            fail-fast: false
            matrix:
                nodejs_versions: [20, 24, 22]
                operating_system: [ubuntu-latest, macos-latest]
                exclude:
                   - nodejs_versions: 20
                     operating_system: macos-latest
        runs-on: ${{matrix.operating_system}}
        steps: 
        - name: checkout respository
          uses: actions/checkout@v4

        - name: setupu NODEJS version ${{matrix.nodejs_versions}}
          uses: actions/setup-node@v4
          with: 
            node-version: ${{matrix.nodejs_versions}}
            

        - name: Install dependencies
          run: npm install

        - name: unit testing
          id: unique-name
          run: npm test

        - name: Archive test result
         ### if: failure() && (steps.unique-name.outcome == 'failure' || steps.unique-name == 'success') adding a always() condition beccause failure condition is running only when the previous step is failure, always() is running previous step outcome is anything
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: mocha-test-result
            path: test-results.xml
            overwrite: true
    
        
    code_coverage: 
       name: code coverage
       runs-on: ubuntu-latest
       steps:
       - name: checkout repository
         uses: actions/checkout@v4

       - name: setup nodejs version 18
         uses: actions/setup-node@v4
         with:
          node_version: 20
       - name: install dependencies
         run: npm install

       - name: check code coverage
         continue-on-error: true
         run: npm run coverage

       - name: Archive test results
         uses: actions/upload-artifact@v4
         with:
          name: code-coverage-results
          path: coverage
          retention-days: 5


         



